name: Synthetic Monitoring

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli
      - name: Monitor critical journeys
        env:
          CI: 'true'
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          chmod +x ./tests/synthetic.sh
          ./tests/synthetic.sh

      - name: Email alert on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: bhawana.official01@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚨 Synthetic monitor FAILED — Acme app prod journey broken"
          to: bhawana.official01@gmail.com
          from: Synthetic Monitor <bhawana.official01@gmail.com>
          body: |
            A critical production journey failed on the Acme app.

            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload Kane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-monitor-logs
          path: /home/runner/.testmuai/kaneai/sessions/