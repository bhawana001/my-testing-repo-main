# .github/workflows/kane-tests.yml
name: Browser Tests

# Run when Vercel reports a deployment status (i.e. the PR/branch preview is ready),
# so we always test the freshly-built code for THIS push, not whatever is live.
on:
  deployment_status

jobs:
  kane-tests:
    # Only run once the deployment actually succeeded and is reachable.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Run browser flows against THIS push's preview deploy
        env:
          CI: 'true'
          # The preview URL Vercel built for this exact commit — the pushed code.
          # The preview is behind Vercel Deployment Protection, so smoke.sh appends
          # the automation bypass token below to let the cloud browser through.
          APP_URL: ${{ github.event.deployment_status.environment_url }}
          # Protection Bypass for Automation secret (Vercel project setting), stored
          # as a GitHub Actions secret. Masked in logs automatically.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          chmod +x ./tests/smoke.sh
          ./tests/smoke.sh

      - name: Upload Kane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kane-test-logs
          path: /home/runner/.testmuai/kaneai/sessions/
